# Shop node: reverse proxy, shared database and search engine for all shop containers.
# Shop containers themselves are created by the backend (see backend/shops/platforms/).
name: shops

services:
  proxy:
    image: traefik:v3.7
    container_name: shops-proxy
    # Shop containers restart with Docker, so the proxy and database they need must too.
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shops
      - --entrypoints.web.address=:80
    ports:
      - "${SHOPS_HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # SELinux (Fedora) blocks access to the Docker socket otherwise.
    security_opt:
      - label=disable
    networks:
      - shops

  db:
    image: mariadb:11.8
    container_name: shops-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${SHOPS_DB_ROOT_PASSWORD:?set SHOPS_DB_ROOT_PASSWORD in infra/shops/.env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10
    networks:
      shops:
        aliases:
          - shops-db

  # Search engine Magento requires; every Magento shop has its own indexes (prefix shop_<id>).
  search:
    image: opensearchproject/opensearch:2.19.4
    container_name: shops-search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Removing a shop deletes its indexes by wildcard.
      action.destructive_requires_name: "false"
    volumes:
      - searchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      retries: 30
    networks:
      shops:
        aliases:
          - shops-search

  # Not running services: `docker compose build wordpress magento` builds the shop images.
  wordpress:
    image: shops/wordpress:7.1
    build: ./woocommerce
    profiles: ["build"]

  magento:
    image: shops/magento:4.0.0
    build: ./magento
    profiles: ["build"]

volumes:
  dbdata:
  searchdata:

networks:
  shops:
    name: shops
