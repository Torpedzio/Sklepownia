# Shop node: reverse proxy, shared database and search engine for all shop containers.
# Shop containers themselves are created by the backend (see backend/shops/platforms/).
name: shops

services:
  proxy:
    image: traefik:v3.7
    container_name: shops-proxy
    # Shop containers restart with Docker, so the proxy and database they need must too.
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shops
      - --entrypoints.web.address=:80
      # Addresses without a running shop: the platform's "temporarily unavailable" page (traefik/fallback.yml).
      - --providers.file.filename=/etc/traefik/fallback.yml
    environment:
      # Where the platform answers; locally the backend on this computer.
      SHOPS_FALLBACK_URL: ${SHOPS_FALLBACK_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${SHOPS_HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/fallback.yml:/etc/traefik/fallback.yml:ro
    # SELinux (Fedora) blocks access to the Docker socket otherwise.
    security_opt:
      - label=disable
    networks:
      - shops

  db:
    image: mariadb:11.8
    container_name: shops-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${SHOPS_DB_ROOT_PASSWORD:?set SHOPS_DB_ROOT_PASSWORD in infra/shops/.env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10
    networks:
      shops:
        aliases:
          - shops-db

  # Catches every e-mail the shops send (order confirmations, account e-mails): read them at http://localhost:8031.
  # Shops reach it as shops-mail:1025 without logging in (SHOPS_SMTP_* in the backend). In production a relay to
  # the mail provider takes its place: one that holds the provider's credentials, so shops never see them.
  mail:
    image: axllent/mailpit:v1.33
    container_name: shops-mail
    restart: unless-stopped
    ports:
      - "${SHOPS_MAIL_UI_PORT:-8031}:8025"
    networks:
      shops:
        aliases:
          - shops-mail

  # Search engine Magento requires; every Magento shop has its own indexes (prefix shop_<id>).
  search:
    image: opensearchproject/opensearch:2.19.4
    container_name: shops-search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Removing a shop deletes its indexes by wildcard.
      action.destructive_requires_name: "false"
    volumes:
      - searchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      retries: 30
    networks:
      shops:
        aliases:
          - shops-search

  # Not running services: `docker compose build wordpress magento` builds the shop images.
  wordpress:
    image: shops/wordpress:7.1
    build: ./woocommerce
    profiles: ["build"]

  magento:
    image: shops/magento:4.0.0
    build: ./magento
    profiles: ["build"]

  # Backups of the shops (backup/shop-backup.sh): the worker runs it for each backup and restore. By hand, e.g.
  # SHOPS_BACKUP_PASSWORD=… docker compose run --rm backup snapshots
  backup:
    image: shops/backup:0.19.1
    build: ./backup
    profiles: ["build"]
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_CACHE_DIR: /cache
      RESTIC_PASSWORD: ${SHOPS_BACKUP_PASSWORD:-}
    volumes:
      - backups:/repository
      - backup-cache:/cache

volumes:
  dbdata:
  searchdata:
  # The restic repository with every shop's backups. Named without the project prefix, as the worker knows it
  # (SHOPS_BACKUP_VOLUME). `docker compose down -v` would remove it with everything else.
  backups:
    name: shops-backups
  # restic's index cache, so a backup doesn't read the whole repository first (SHOPS_BACKUP_CACHE_VOLUME).
  backup-cache:
    name: shops-backup-cache

networks:
  shops:
    name: shops
