{# A titled list of label/value rows, e.g. shop details or payment details. #}
<tr>
  <td style="padding:4px 32px 24px;">
    <p style="margin:0 0 8px; font-size:16px; font-weight:700;">{{ title }}</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
      {% for label, value in rows %}
      <tr>
        <td style="padding:7px 12px 7px 0; border-top:1px solid #D9DEE8; color:#5B6478; white-space:nowrap; vertical-align:top;">{{ label }}</td>
        <td style="padding:7px 0; border-top:1px solid #D9DEE8; text-align:right; word-break:break-word;">{{ value }}</td>
      </tr>
      {% endfor %}
    </table>
    {% if note %}<p style="margin:12px 0 0; font-size:13px; line-height:1.5; color:#5B6478;">{{ note }}</p>{% endif %}
  </td>
</tr>
