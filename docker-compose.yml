services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        DEV: "1"
    env_file: .env
    volumes:
      - ./backend:/app:Z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        DEV: "1"
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - ./backend:/app:Z
      # Creates shop containers on the shop node (infra/shops).
      - /var/run/docker.sock:/var/run/docker.sock
    # SELinux (Fedora) blocks access to the Docker socket otherwise.
    security_opt:
      - label=disable
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
