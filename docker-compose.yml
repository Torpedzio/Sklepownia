services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Catches every e-mail the platform sends; read them at http://localhost:8030. Nothing leaves the machine.
  mail:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "${MAIL_UI_PORT:-8030}:8025"

  backend:
    build:
      context: ./backend
      args:
        DEV: "1"
    env_file: .env
    environment:
      MEDIA_ROOT: /media
    volumes:
      - ./backend:/app:Z
      # Read-only repository for the documentation pages under /docs/ (HANDBOOK_ROOT).
      - .:/project:ro
      # Uploaded files (avatars), kept outside the code checkout.
      - media:/media
    # SELinux (Fedora) would otherwise need the whole repository relabelled for the mount above.
    security_opt:
      - label=disable
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        DEV: "1"
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - ./backend:/app:Z
      # Creates shop containers on the shop node (infra/shops).
      - /var/run/docker.sock:/var/run/docker.sock
    # SELinux (Fedora) blocks access to the Docker socket otherwise.
    security_opt:
      - label=disable
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Starts scheduled tasks (CELERY_BEAT_SCHEDULE), e.g. charging plan renewals; the worker runs them.
  beat:
    build:
      context: ./backend
      args:
        DEV: "1"
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./backend:/app:Z
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media:
